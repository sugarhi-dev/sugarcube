name: Deploy test

on:
  push:
    branches:
      - test

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to test
    runs-on: [self-hosted, test]
    steps:
      - name: Notify Slack deploy started
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: "New code is being deployed to the test site"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":rocket: *New code is being deployed*\nThe test site is updating now. It will be ready in a few minutes.\n*Pushed by:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Watch the deploy>"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "What changed"
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(github.event.head_commit.message) }}

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Ensure test secrets
        id: secrets
        run: |
          export SUGARCUBE_TEST_ENV="${HOME}/.config/sugarcube/test.env"
          chmod +x server/docker/test/ensure-secrets.sh
          ./server/docker/test/ensure-secrets.sh
          install -m 600 "$SUGARCUBE_TEST_ENV" server/docker/test/.env

      - name: Install Cloudflare origin key
        id: origin-key
        env:
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        run: |
          if [[ -z "${CLOUDFLARE_ORIGIN_KEY}" ]]; then
            echo "GitHub Actions secret CLOUDFLARE_ORIGIN_KEY is empty" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$CLOUDFLARE_ORIGIN_KEY" > server/config/test/cloudflare_origins.key

      - name: Deploy infra and server
        id: deploy-server
        run: |
          docker compose -f server/docker/test/docker-compose.yml --env-file server/docker/test/.env up -d --build --force-recreate --remove-orphans

      - name: Deploy client
        id: deploy-client
        run: |
          docker compose -f client/docker/test/docker-compose.yml up -d --build --force-recreate --remove-orphans

      - name: Verify containers
        id: verify
        run: |
          docker compose -f server/docker/test/docker-compose.yml --env-file server/docker/test/.env ps
          docker compose -f client/docker/test/docker-compose.yml ps

      - name: Notify Slack deploy succeeded
        if: steps.checkout.outcome == 'success' && steps.secrets.outcome == 'success' && steps.origin-key.outcome == 'success' && steps.deploy-server.outcome == 'success' && steps.deploy-client.outcome == 'success' && steps.verify.outcome == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: "Done. The test site is up with the new code"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":white_check_mark: *The test site is up*\nThe new code is deployed and ready to use.\n*Pushed by:* ${{ github.actor }}\n<https://test.sugarcube.tv/sugarhi/|Open the test site>"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "What changed"
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(github.event.head_commit.message) }}

      - name: Notify Slack deploy failed
        if: steps.checkout.outcome == 'failure' || steps.secrets.outcome == 'failure' || steps.origin-key.outcome == 'failure' || steps.deploy-server.outcome == 'failure' || steps.deploy-client.outcome == 'failure' || steps.verify.outcome == 'failure'
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            text: "The deploy failed. The test site is not up"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":x: *The deploy failed*\nThe new code did not go live, and the test site is not up.\n*Pushed by:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|See what went wrong>"
              - type: context
                elements:
                  - type: mrkdwn
                    text: "What changed"
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(github.event.head_commit.message) }}
