server {
    # Cloudflare opens a TLS connection to origin port 443.
    # cloudflare_origins.cert is in this directory. The key is written at deploy time.
    listen 443 ssl;
    http2 on;
    server_name test.sugarcube.tv;

    ssl_certificate     /etc/nginx/certs/cloudflare_origins.cert;
    ssl_certificate_key /etc/nginx/certs/cloudflare_origins.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 200m;

    # Docker DNS. Names used in variables are resolved per request. A hostname
    # written directly in proxy_pass is resolved once, at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /idp {
        return 301 /idp/;
    }

    # Bookmarks and the previous Slack link used this prefix.
    location = /sugarhi {
        return 301 /;
    }

    location /sugarhi/ {
        rewrite ^/sugarhi/(.*)$ /$1 permanent;
    }

    # The client container is recreated after nginx starts, so this name has to
    # be resolved per request. Longer prefixes (/api/, /idp/, /content/) still win.
    location / {
        set $client_upstream sugarcube-client-test:8080;
        proxy_pass http://$client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Seaweed S3. Presigned URLs are signed for this Host, so it must match S3_ENDPOINT.
    location /content/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://seaweedfs:8333/;
        proxy_http_version 1.1;
        proxy_set_header Host seaweedfs:8333;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $api_upstream sugarcube-server-test:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /idp/ {
        proxy_pass http://sugarcube-keycloak-test:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
