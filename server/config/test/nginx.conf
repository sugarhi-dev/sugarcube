server {
    # Cloudflare opens a TLS connection to origin port 443. The Origin CA cert is in ../secrets.
    listen 443 ssl;
    http2 on;
    server_name test.sugarcube.tv;

    ssl_certificate     /etc/nginx/certs/cloudflare_origins.cert;
    ssl_certificate_key /etc/nginx/certs/cloudflare_origins.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 200m;

    location = /idp {
        return 301 /idp/;
    }

    location /sugarhi/ {
        proxy_pass http://sugarcube-client-test:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Seaweed S3. Presigned URLs are signed for this Host, so it must match S3_ENDPOINT.
    location /content/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://seaweedfs:8333/;
        proxy_http_version 1.1;
        proxy_set_header Host seaweedfs:8333;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://sugarcube-server-test:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /idp/ {
        proxy_pass http://sugarcube-keycloak-test:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
