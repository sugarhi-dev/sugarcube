name: sugarcube

services:
  postgres:
    image: postgres:18
    container_name: sugarcube-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: sugarcube
      POSTGRES_PASSWORD: sugarcube
      POSTGRES_DB: sugarcube
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugarcube -d sugarcube"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak-db-init:
    image: postgres:18
    container_name: sugarcube-keycloak-db-init
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: sugarcube
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        if ! psql -h 127.0.0.1 -U sugarcube -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1; then
          psql -h 127.0.0.1 -U sugarcube -d postgres -c "CREATE DATABASE keycloak OWNER sugarcube"
        fi

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: sugarcube-keycloak
    restart: unless-stopped
    network_mode: host
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5432/keycloak
      KC_DB_USERNAME: sugarcube
      KC_DB_PASSWORD: sugarcube
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: 127.0.0.1
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost/idp
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../../keycloak-theme/copythat:/opt/keycloak/themes/copythat:ro,z
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.28
    container_name: sugarcube-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../../config/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - keycloak

volumes:
  postgres_data:
